<div class="projects-dashboard">
  <header class="header">
    <h1>Mis proyectos</h1>
    <button class="btn" (click)="toggleCreateForm()">{{ showCreateForm ? 'Cerrar' : 'Nuevo proyecto' }}</button>
  </header>

  <section *ngIf="loading$ | async" class="loading">Cargando proyectos...</section>
  <section *ngIf="(error$ | async) as err" class="error">{{ err }}</section>

  <div class="projects-list" *ngIf="projects$ | async as projects">
    <div *ngFor="let project of projects" class="project-card">
      <h2>{{ project.name }}</h2>
      <p>{{ project.code }}</p>
      <p>{{ project.clientName }}</p>
    </div>
  </div>
</div>
