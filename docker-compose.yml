version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: valuations_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: valuations_db
      POSTGRES_USER: valuations_user
      POSTGRES_PASSWORD: valuations_pass
    ports:
      - "5435:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build: ./valuations-api
    container_name: valuations_api
    command: npm run start:dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Sobrescribe DATABASE_URL para que Prisma use el host "db"
      DATABASE_URL: postgres://valuations_user:valuations_pass@db:5435/valuations_db
    depends_on:
      - db

  web:
    build: ./valuations-web
    container_name: valuations_web
    ports:
      - "3001:3000"
    environment:
      # Next.js: variable pública para la URL del API en Docker
      NEXT_PUBLIC_API_URL: http://api:3000
    depends_on:
      - api

volumes:
  db-data:
